# §1 Tracker integration
[[fill]]
find = "- **Cross-link form (commit/PR → tracker):** TODO (e.g. `Fixes #nnnn` for GitHub Issues)"
replace = "- **Cross-link form (commit/PR → tracker):** `Fixes #<id>` in the PR body (`[tracker].issue_trailer`); `Refs #<id>` for partial work. The product's required `require-linked-issue` check fails a PR with neither."

[[fill]]
find = "- **Per-release field updated on a fix:** TODO"
replace = "- **Per-release field updated on a fix:** the milestone. Every issue sits on the milestone of the release it ships in; the lowest open milestone is the next release (product README, Releases)."

# §2 Branch-target rules
[[fill]]
find = "- **Cross-version cherry-pick rules:** TODO / none"
replace = "- **Cross-version cherry-pick rules:** none; there are no maintenance branches."

[[fill]]
find = "- **Master-vs-maintenance rule:** TODO (cite the project's own statement)"
replace = """- **Master-vs-maintenance rule:** every change targets `main`. Releases are `vX.Y.0` tags
  cut from `main` (product README, Releases).
- **Immutability rule (host-enforced):** the product's `docs-immutability` check forbids
  editing an Accepted ADR, an accepted proposal or a stable spec
  (`../{{PROJECT_NAME}}/docs/design/adr/`, ADR-0001, ADR-0004). A Plan that needs to change
  one authors a **new** document carrying `supersedes:`; the old file changes only its
  `status:`.
- **Plan foundation, the design corpus read in place (never copied):** ground a brief on
  the tracker issue **and** on `../{{PROJECT_NAME}}/docs/design/`: ADRs (`adr/`), proposals
  (`proposals/`), the architecture overview (`architecture/`, with the threat model in §14)
  and specs (`specs/`), indexed by `docs/design/README.md`. Read them with `git -C
  ../{{PROJECT_NAME}} …`, Read and Grep; they are reference, not bundle artifacts, so they
  are not wired as copy-based `[[plan.source]]` providers."""

