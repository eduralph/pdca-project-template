> keeps the result bundles and the process log, never modifies the product's tree outside
> a fix, and reads the product's design documents in place. The product's process is
> recorded in its ADRs (`../{{PROJECT_NAME}}/docs/design/adr/`) and
> `../{{PROJECT_NAME}}/docs/governance/GOVERNANCE.md`; those are the normative sources cited
> below.
