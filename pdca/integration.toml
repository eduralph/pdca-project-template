# pdca-project-template already gives, modelled on wyrd-pdca's. scripts/init-instance.sh
# replaces each `find` line (matched exactly, once) with `replace`. A `find` that is no
# longer in the rendered file (pdca-harness changed its wording) is reported and skipped;
# fill that item by hand.

[[fill]]
find = "> Copier pre-filled what it could from your answers. Everything marked **TODO**"
replace = """> **Host repo:** {{PROJECT_NAME}}, at the sibling checkout `../{{PROJECT_NAME}}`
